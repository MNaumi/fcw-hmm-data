name: Spielplan aus PDF aktualisieren

on:
  push:
    paths:
      - 'schedule.pdf'
      - 'parse_schedule.py'
      - '.github/workflows/update-schedule.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - run: python parse_schedule.py schedule.pdf matches.json
      - name: Mit TheSportsDB anreichern (Zeiten/Resultate)
        id: enrich
        run: python update_from_thesportsdb.py
      - name: Commit aktualisierte matches.json
        env:
          HINWEIS_MSG: ${{ steps.enrich.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen am Spielplan."
          else
            MSG="$HINWEIS_MSG"
            if [ -z "$MSG" ]; then MSG="Spielplan automatisch aus PDF aktualisiert"; fi
            git commit -m "$MSG"
            git push
          fi
