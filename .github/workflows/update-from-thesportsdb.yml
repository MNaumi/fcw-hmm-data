name: Spieldaten von TheSportsDB aktualisieren

on:
  schedule:
    # Morgens 05:00 UTC (Termine/Zeiten) und abends 22:30 UTC (Resultate des Spieltags)
    - cron: '0 5 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest test_update_from_thesportsdb
      - name: Daten anreichern
        id: enrich
        run: python update_from_thesportsdb.py
      - name: Änderungen committen
        env:
          HINWEIS_MSG: ${{ steps.enrich.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen an den Spieldaten."
          else
            MSG="$HINWEIS_MSG"
            if [ -z "$MSG" ]; then MSG="Spieldaten automatisch von TheSportsDB aktualisiert"; fi
            git commit -m "$MSG"
            git push
          fi
